apiVersion: apps/v1
kind: Deployment
metadata:
  name: bank-marketing-predictor
  labels:
    app: bank-marketing-predictor
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bank-marketing-predictor
  template:
    metadata:
      labels:
        app: bank-marketing-predictor
    spec:
      containers:
        - name: streamlit-app
          image: bank-ml-app:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8501
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
            initialDelaySeconds: 20
            periodSeconds: 15
